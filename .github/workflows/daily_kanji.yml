name: Daily Kanji Bot

on:
  schedule:
    - cron: '0 16 * * *'  # UTC 기준 오후 4시 = 한국 시간 새벽 1시
  workflow_dispatch:      # 수동 테스트(Run workflow) 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # 깃허브 레포지토리에 progress.txt 자동 커밋/푸시를 위한 필수 권한
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Run Python script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python kanji_bot.py

      - name: Commit and push progress
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.txt
          git diff --staged --quiet || git commit -m "Update progress.txt automatically"
          git push
