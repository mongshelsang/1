name: ETF Screener

on:
  schedule:
    # 서머타임/표준시 무관하게 매일 장 마감 후 1회 실행 (UTC 22:30)
    - cron: "30 22 * * *"
  workflow_dispatch: {}

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install latest dependencies
        run: pip install --upgrade --no-cache-dir yfinance pandas

      - name: Run ETF screener
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python etfscreen.py
